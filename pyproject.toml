[project]
name = "isovalent-mcp"
version = "0.1.0"
description = "MCP server for Isovalent Enterprise (Cilium, Tetragon, Timescape)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.2,<5",
    "kubernetes>=31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
isovalent-mcp = "isovalent_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isovalent_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
